<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In - The Great Outdoors</title>
  <link rel="stylesheet" href="../styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      background: #f3f4f6;
      min-height: 100vh;
    }

    .auth-page {
      min-height: calc(100vh - 64px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 16px;
    }

    .auth-card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 40px 36px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.07);
    }

    .auth-card-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .auth-card-icon {
      width: 64px;
      height: 64px;
      background: rgba(45, 80, 22, 0.1);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
    }

    .auth-card-icon svg {
      width: 30px;
      height: 30px;
      stroke: #2d5016;
    }

    .auth-card-header h1 {
      font-size: 24px;
      font-weight: bold;
      color: #222;
      margin-bottom: 6px;
    }

    .auth-card-header p {
      font-size: 15px;
      color: #666;
    }

    /* ALERTS */
    .alert {
      display: none;
      align-items: center;
      gap: 10px;
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 20px;
      font-size: 14px;
    }

    .alert.visible { display: flex; }

    .alert svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    .alert-error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
    }

    .alert-error svg { stroke: #b91c1c; }

    .alert-success {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #15803d;
    }

    .alert-success svg { stroke: #15803d; }

    /* FORM */
    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
    }

    .input-wrap {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      stroke: #9ca3af;
      pointer-events: none;
      transition: stroke 0.2s;
    }

    .input-wrap:focus-within .input-icon {
      stroke: #2d5016;
    }

    .form-group input[type="email"],
    .form-group input[type="password"],
    .form-group input[type="text"] {
      width: 100%;
      padding: 11px 16px 11px 42px;
      border: 1.5px solid #e5e7eb;
      border-radius: 8px;
      font-size: 15px;
      color: #111;
      font-family: inherit;
      outline: none;
      background: #fafafa;
      transition: border-color 0.2s, box-shadow 0.2s;
      box-sizing: border-box;
    }

    .form-group input:focus {
      border-color: #2d5016;
      box-shadow: 0 0 0 3px rgba(45, 80, 22, 0.1);
      background: white;
    }

    .toggle-pw {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      color: #9ca3af;
      transition: color 0.2s;
    }

    .toggle-pw:hover { color: #2d5016; }
    .toggle-pw svg { width: 18px; height: 18px; stroke: currentColor; }

    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .check-label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 14px;
      color: #555;
      user-select: none;
    }

    .check-label input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border: 1.5px solid #d1d5db;
      border-radius: 5px;
      background: white;
      cursor: pointer;
      position: relative;
      flex-shrink: 0;
      transition: background 0.2s, border-color 0.2s;
    }

    .check-label input[type="checkbox"]:checked {
      background: #2d5016;
      border-color: #2d5016;
    }

    .check-label input[type="checkbox"]:checked::after {
      content: '';
      position: absolute;
      left: 5px;
      top: 2px;
      width: 5px;
      height: 9px;
      border: 2px solid white;
      border-top: none;
      border-left: none;
      transform: rotate(42deg);
    }

    .forgot-link {
      font-size: 14px;
      color: #2d5016;
      font-weight: 500;
      text-decoration: none;
    }

    .forgot-link:hover { text-decoration: underline; }

    /* BUTTON */
    .btn-auth {
      width: 100%;
      padding: 13px;
      background: #2d5016;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
      margin-bottom: 20px;
    }

    .btn-auth:hover {
      background: #3a6b1d;
      box-shadow: 0 4px 14px rgba(45, 80, 22, 0.3);
      transform: translateY(-1px);
    }

    .btn-auth:active { transform: translateY(0); }

    .btn-auth:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* DIVIDER */
    .form-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      font-size: 13px;
      color: #9ca3af;
    }

    .form-divider::before,
    .form-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #e5e7eb;
    }

    /* PROMPT */
    .auth-prompt {
      text-align: center;
      font-size: 14px;
      color: #666;
    }

    .auth-prompt a {
      color: #2d5016;
      font-weight: 600;
      text-decoration: none;
    }

    .auth-prompt a:hover { text-decoration: underline; }

    /* RESPONSIVE */
    @media (max-width: 480px) {
      .auth-card { padding: 28px 20px; }
      .auth-page { padding: 24px 12px; align-items: flex-start; }
    }
  </style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="../index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:28px;height:28px;vertical-align:middle;margin-right:6px;">
        <path d="m17 14 3 3.3a1 1 0 0 1-.7 1.7H4.7a1 1 0 0 1-.7-1.7L7 14h-.3a1 1 0 0 1-.7-1.7L9 9h-.2A1 1 0 0 1 8 7.3L12 3l4 4.3a1 1 0 0 1-.8 1.7H15l3 3.3a1 1 0 0 1-.7 1.7H17z"/><path d="M12 22v-3"/>
      </svg>The Great Outdoors
    </a>
    <button class="hamburger" id="hamburger" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>
    <nav class="nav" id="nav">
      <a href="../index.html">Home</a>
      <a href="trails.html">Find Trails</a>
      <a href="responsible.html">Responsible Recreation</a>
      <a href="about.html">About</a>
    </nav>
  </div>
</header>

<div class="auth-page">
  <div class="auth-card">

    <div class="auth-card-header">
      <div class="auth-card-icon">
        <i data-lucide="log-in"></i>
      </div>
      <h1>Welcome Back</h1>
      <p>Log in to your account to continue</p>
    </div>

    <!-- Error alert -->
    <div class="alert alert-error" id="errorAlert" role="alert">
      <i data-lucide="alert-circle"></i>
      <span id="errorText"></span>
    </div>

    <!-- Success alert -->
    <div class="alert alert-success" id="successAlert" role="alert">
      <i data-lucide="check-circle"></i>
      <span id="successText"></span>
    </div>

    <form id="loginForm" novalidate>

      <div class="form-group">
        <label for="email">Email Address</label>
        <div class="input-wrap">
          <i data-lucide="mail" class="input-icon"></i>
          <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrap">
          <i data-lucide="lock" class="input-icon"></i>
          <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
          <button type="button" class="toggle-pw" id="togglePw" aria-label="Show password">
            <i data-lucide="eye"></i>
          </button>
        </div>
      </div>

      <div class="form-options">
        <label class="check-label">
          <input type="checkbox" id="rememberMe" name="rememberMe">
          Remember me
        </label>
        <a href="#" class="forgot-link">Forgot password?</a>
      </div>

      <button type="submit" class="btn-auth" id="loginBtn">Log In</button>

    </form>

    <div class="form-divider">or</div>

    <p class="auth-prompt">
      Don't have an account? <a href="signup.html">Sign up here</a>
    </p>

  </div>
</div>

<script>
  lucide.createIcons();

  const hamburger = document.getElementById('hamburger');
  const nav = document.getElementById('nav');
  hamburger.addEventListener('click', () => nav.classList.toggle('open'));
  nav.querySelectorAll('a').forEach(l => l.addEventListener('click', () => nav.classList.remove('open')));

  // Password toggle
  const pwInput   = document.getElementById('password');
  const toggleBtn = document.getElementById('togglePw');
  toggleBtn.addEventListener('click', () => {
    const show = pwInput.type === 'password';
    pwInput.type = show ? 'text' : 'password';
    toggleBtn.innerHTML = show ? '<i data-lucide="eye-off"></i>' : '<i data-lucide="eye"></i>';
    lucide.createIcons();
  });

  // Alerts
  function showError(msg) {
    document.getElementById('errorText').textContent = msg;
    document.getElementById('errorAlert').classList.add('visible');
    document.getElementById('successAlert').classList.remove('visible');
    lucide.createIcons();
  }

  function showSuccess(msg) {
    document.getElementById('successText').textContent = msg;
    document.getElementById('successAlert').classList.add('visible');
    document.getElementById('errorAlert').classList.remove('visible');
    lucide.createIcons();
  }

  function clearAlerts() {
    document.getElementById('errorAlert').classList.remove('visible');
    document.getElementById('successAlert').classList.remove('visible');
  }

  document.getElementById('email').addEventListener('input', clearAlerts);
  document.getElementById('password').addEventListener('input', clearAlerts);

  // Demo account
  const DEMO = { email: 'demo@greatoutdoors.com', password: 'demo1234', name: 'Demo User' };

  // Get registered users from localStorage
  function getUsers() {
    return JSON.parse(localStorage.getItem('goUsers') || '[]');
  }

  // Form submit
  document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const remember = document.getElementById('rememberMe').checked;
    const btn      = document.getElementById('loginBtn');

    if (!email)    { showError('Please enter your email address.'); return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showError('Please enter a valid email address.'); return; }
    if (!password) { showError('Please enter your password.'); return; }

    clearAlerts();
    btn.textContent = 'Logging in…';
    btn.disabled = true;

    setTimeout(() => {
      // Check demo account
      const isDemo = email === DEMO.email && password === DEMO.password;

      // Check registered users
      const users = getUsers();
      const match = users.find(u => u.email === email && u.password === password);

      if (isDemo || match) {
        const user = isDemo ? DEMO : match;
        // Save session
        const storage = remember ? localStorage : sessionStorage;
        storage.setItem('goCurrentUser', JSON.stringify({ name: user.name, email: user.email }));

        showSuccess('Logged in! Redirecting…');
        setTimeout(() => { window.location.href = '../index.html'; }, 1000);
      } else {
        btn.textContent = 'Log In';
        btn.disabled = false;
        showError('Incorrect email or password. Please try again.');
      }
    }, 800);
  });
</script>

</body>
</html>
